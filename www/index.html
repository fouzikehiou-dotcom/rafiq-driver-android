<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14212b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Rafiq Driver · رفيق السائق</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14212b;--mute:#5d6b77;--line:#d5dbe1;--amber:#e0a019;--green:#2a9d5c;--red:#d64545;--navy:#14212b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d151c;--card:#16222c;--ink:#e8edf1;--mute:#93a1ad;--line:#2a3945;--navy:#0a1117;--amber:#f2b134;--green:#3fae6a;--red:#ef6a6a}}
:root[data-theme="dark"]{--bg:#0d151c;--card:#16222c;--ink:#e8edf1;--mute:#93a1ad;--line:#2a3945;--navy:#0a1117;--amber:#f2b134;--green:#3fae6a;--red:#ef6a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
header{background:var(--navy);color:#f3f5f7;padding:10px 14px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.top button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
nav{display:flex;margin-top:6px}
nav button{flex:1;background:none;border:0;border-bottom:4px solid transparent;color:#9fb0bd;font:inherit;font-weight:600;padding:8px 2px;cursor:pointer}
nav button[aria-selected=true]{color:#fff;border-color:var(--amber)}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;margin-bottom:8px}
textarea{min-height:90px}
.btn{width:100%;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:800;background:var(--green);color:#fff;cursor:pointer}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 4px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lim{flex:none;border:7px solid var(--red);border-radius:50%;width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:800;background:#fff;color:#14212b;direction:ltr}
.big{font-size:1.2rem;font-weight:800}.mute{color:var(--mute);font-size:.88rem}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:800;color:#fff}
.ok{background:var(--green)}.bad{background:var(--red)}.warn{background:var(--amber);color:#14212b}
.z{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);direction:ltr}
.st{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.st.here{background:rgba(224,160,25,.2);margin:0 -14px;padding-inline:14px}
.st .tm{min-width:84px;direction:ltr;text-align:start;font-weight:600}
.st .n{flex:1}.st .n small{display:block}.sy{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;vertical-align:middle;background:#000;color:#fff;border-radius:4px;font-size:.62rem;font-weight:800;margin-inline-end:8px;font-style:normal}.sy.sp{background:none}.sg{display:inline-block;width:30px;height:30px;flex:none;vertical-align:middle;border:2px solid #d62828;border-radius:3px;margin-inline-end:8px;background:conic-gradient(#fff 0 25%,#d62828 0 50%,#fff 0 75%,#d62828 0)}
.card{box-shadow:0 1px 4px rgba(0,0,0,.08);border-radius:14px}header{background:linear-gradient(135deg,var(--navy),#22445a)}.top #who{font-weight:800;font-size:1rem}.lim{box-shadow:0 2px 10px rgba(214,69,69,.35)}.btn{border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.2)}.st{padding:11px 0}.here .big,#here{font-size:1.15rem}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}#sheet .box{background:var(--card);color:var(--ink);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}#sheet .num{font-size:1.7rem;font-weight:800;direction:ltr;text-align:center;margin:6px 0 12px}#sheet .btn{margin-top:8px}
#sheet2{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}#sheet2 .box{background:var(--card);color:var(--ink);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}button.tag{border:0;cursor:pointer;font:inherit;font-weight:800;padding:4px 14px}
.gauge{font-size:3.2rem;font-weight:800;line-height:1;direction:ltr;text-align:center}
.bar{height:12px;background:var(--line);border-radius:6px;position:relative;margin-top:8px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green);width:0}
.bar u{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--red)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="login" hidden>
  <div class="card">
    <h2 data-i="loginT"></h2>
    <input id="uid" autocapitalize="characters" data-p="uid" autocomplete="off">
    <input id="uname" data-p="uname" autocomplete="off"><p id="lerr" class="mute" style="color:var(--red)"></p>
    <button class="btn" id="lgo" data-i="enter"></button>
    <p class="mute" data-i="loginNote"></p>
    <button class="btn s" id="lang0">العربية / Français</button>
  </div>
</main>

<div id="sheet" hidden><div class="box"><div class="mute" data-i="callQ"></div><div class="big" id="sh-name"></div><div class="num" id="sh-num"></div><button class="btn" id="sh-call" data-i="callBtn"></button><button class="btn s" id="sh-x" data-i="cancel"></button></div></div>
<div id="sheet2" hidden><div class="box"><div class="mute" data-i="svT"></div><div id="sv2-body"></div><button class="btn s" id="sv2-x" data-i="closeB"></button></div></div>
<div id="app" hidden>
<header>
  <div class="top"><span id="who"></span><span><button id="lang">FR</button> <button id="out" data-i="logout"></button></span></div>
  <nav role="tablist">
    <button data-t="trip" data-i="tTrip"></button><button data-t="hours" data-i="tHours"></button>
    <button data-t="rep" data-i="tRep"></button><button data-t="data" data-i="tData"></button>
  </nav>
</header>
<main>
<section id="trip">
  <div class="card">
    <div class="row"><input id="tno" data-p="trainNo" style="margin:0" autocapitalize="characters"><button class="btn" id="tgo" style="width:auto;padding:12px 20px" data-i="go"></button></div>
    <p class="mute" id="tmsg" style="margin:8px 0 0"></p>
  </div>
  <div id="tinfo" hidden>
    <div class="card">
      <div class="big" id="tt"></div><div class="mute" id="tr"></div>
      <div class="seg" id="cat" style="margin:8px 0 0"></div>
    </div>
    <div class="card">
      <div class="row">
        <div>
          <div class="mute" data-i="cur"></div><div class="big" id="here">--</div>
          <div class="mute" id="jx"></div><div id="svc" style="margin:4px 0"></div>
          <div class="mute" id="dl"></div>
          <div class="mute" style="margin-top:6px" data-i="next"></div><div class="big" id="nx">--</div><div class="mute" id="nd"></div>
          <div id="ph"></div>
        </div>
        <div style="text-align:center"><div class="lim" id="lim">--</div><div class="mute" data-i="maxsp"></div></div>
      </div>
      <div class="seg" style="margin-top:10px"><button id="prv">◀</button><button id="auto" data-i="auto"></button><button id="nxt">▶</button></div>
    </div>
    <div class="card"><div class="mute" data-i="zones"></div><div id="zones"></div></div>
    <div class="card">
      <div class="row"><div class="mute" data-i="tacho"></div><button class="btn s" id="gps" style="width:auto;padding:6px 14px"></button></div>
      <div class="gauge"><span id="spd">--</span> <small class="mute">km/h</small></div>
      <div class="bar"><i id="gb"></i><u id="gl" hidden></u></div>
    </div>
    <div class="card"><div class="mute" data-i="sched"></div><div id="stations"></div></div>
  </div>
</section>

<section id="hours" hidden>
  <div class="card">
    <label class="mute" data-i="date"></label><input type="date" id="hd">
    <label class="mute" data-i="t2"></label><input id="t2" autocapitalize="characters">
    <details style="margin-bottom:8px"><summary class="mute" data-i="editTimes"></summary><label class="mute" data-i="hs"></label><input type="time" id="hs"><label class="mute" data-i="hd2"></label><input type="date" id="hd2">
    <label class="mute" data-i="he"></label><input type="time" id="he"></details>
    <button class="btn" id="hc" data-i="saveDay"></button>
    <p class="mute" data-i="hnote"></p>
  </div>
  <div class="card" id="hout"></div>
  <div class="card">
    <div class="mute" data-i="reserveT"></div>
    <select id="rshift"><option value="240">04h00 → 12h00</option><option value="720">12h00 → 20h00</option><option value="1200">20h00 → 04h00</option></select>
    <label class="mute" data-i="otH"></label><input type="number" id="rot" min="0" max="4" step="0.5" value="0">
    <button class="btn" id="rsv" data-i="saveRes"></button>
  </div>
  <div class="card">
    <div class="mute" data-i="logT"></div>
    <input type="month" id="hm">
    <div id="msum"></div>
    <div id="hlog"></div>
  </div>
</section>

<section id="rep" hidden>
  <div class="card">
    <select id="rtype"></select>
    <textarea id="rtxt" data-p="rtxt"></textarea>
    <button class="btn" id="rsave" data-i="save"></button>
  </div>
  <div class="card"><div id="rlist"></div><button class="btn s" id="rcopy" data-i="copyAll"></button></div>
</section>

<section id="data" hidden>
  <div class="card">
    <div class="mute" data-i="phones"></div>
    <select id="pst"></select><input id="pnum" inputmode="tel" data-p="phone">
    <button class="btn" id="psave" data-i="save"></button>
    <div id="plist" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <div class="mute" data-i="svcT"></div>
    <textarea id="svcj" style="min-height:160px;direction:ltr;font-family:monospace;font-size:.8rem"></textarea>
    <div class="seg"><button id="svsave" data-i="save"></button><button id="svreset" data-i="reset"></button></div>
    <p class="mute" id="svmsg"></p>
  </div>
  <div class="card"><div class="mute" data-i="usersT"></div><textarea id="usrj" style="min-height:120px;direction:ltr;font-family:monospace;font-size:.8rem" placeholder='{"026905E":{"n":"Prénom","l":"Nom"}}'></textarea><button class="btn" id="ussave" data-i="save"></button><p class="mute" id="usmsg"></p></div>
  <p class="mute" data-i="warn"></p>
</section>
</main>
</div>

      stops.push({s:o[i],a:A,d:D})}

}

function loadTrain(){
  const n=$("tno").value.trim().toUpperCase();
  if(!TR[n]){$("tmsg").textContent=t("notFound");$("tinfo").hidden=true;tr=null;return}
  tr=TR[n];$("tmsg").textContent="";$("tinfo").hidden=false;cat=0;autoPick();drawTrip();$("hs").value="";$("he").value="";$("t2").value="";prefillHours();showDay();
}
function autoPick(){
  const o=ord(),m=nowM();let best=0;
  tr.stops.forEach(s=>{let d=s.d;const diff=(m-d+1440+720)%1440-720;if(diff>=0){best=o.indexOf(s.s)}});
  cur=Math.max(0,best);
}
function drawTrip(){
  if(!tr)return;
  const o=ord(),l=LINES[tr.li],a=tr.stops[0].s,b=tr.stops[tr.stops.length-1].s;
  $("tt").textContent=t("start")+" "+tr.no+" · "+a+" → "+b;
  $("tr").textContent=[...new Set(o.map(x=>LINES[x[2]].n))].join(" + ")+" · "+(isFreight(tr.no)?t("freight"):t("pass"))+(o.some(x=>LINES[x[2]].approx)?" · ⚠ "+t("approx"):"");
  $("cat").innerHTML=isFreight(tr.no)?"":[0,1].map(i=>`<button data-c="${i}" class="${i===cat?"on":""}">${["≥ 9/10","< 9/10"][i]}</button>`).join("");
  $("stations").innerHTML=o.map((s,i)=>{const p=stop(s[0]),st=svcState(s[0]);
    const tm=p?hm(p.a)+(p.d!==p.a?" / "+hm(p.d):""):"—";
    return`<div class="st ${i===cur?"here":""}" data-i="${i}"><span class="tm">${tm}</span><span class="n">${sy(s[0])}${nm(s[0])}<small class="mute">PK ${fmt(s[1])}${jx(s[0],s[2])?" · "+jx(s[0],s[2]):""}</small></span>${st?`<span class="tag ${st.closed?"bad":"ok"}">${st.closed?t("closed"):t("open")}</span>`:""}</div>`}).join("");
  info();
}
function info(){
  const o=ord();if(cur==null||cur>=o.length)cur=0;
  const s=o[cur],n=o[cur+1],p=stop(s[0]),m=nowM();
  $("here").innerHTML=sy(s[0])+nm(s[0])+" · PK "+fmt(s[1]);
  $("jx").textContent=jx(s[0],s[2]);
  const st=svcState(s[0]),sv=S.svc[s[0]];$("svc").innerHTML=(st||sv||SVR[s[0]])?`<button class="tag ${st?(st.closed?"bad":"ok"):"warn"}" id="svbtn">${st?(st.closed?t("closed"):t("open")):"ⓘ"} ⓘ</button>`:"";
  const ph=phoneFor(s[0]);$("ph").innerHTML=ph?`<a href="tel:${ph}">📞 ${ph}</a>`:"";
  if(p){const diff=Math.round((m-p.d+1440+720)%1440-720);$("dl").textContent=diff>0?t("late")+" +"+diff+" "+t("min"):diff<0?t("early")+" "+(-diff)+" "+t("min"):"0";}
  else $("dl").textContent="";
  if(!n){$("nx").textContent=t("term");$("nd").textContent="";$("lim").textContent="--";$("zones").innerHTML="";return}
  $("nx").innerHTML=sy(n[0])+nm(n[0])+" · PK "+fmt(n[1]);
  const nl=n[2],ndr=n[3],sk=(LINES[nl].st.find(x=>x[0]===s[0])||s)[1];
  const nxt=tr.stops.filter(x=>ord().indexOf(x.s)>cur)[0];
  $("nd").textContent=t("dist")+": "+Math.abs(n[1]-sk).toFixed(1)+" "+t("km")+(nxt?" · "+t("eta")+" "+nxt.s+" "+hm(nxt.a):"");
  const zs=zonesIn(sk,n[1],nl,ndr),v=zs.length?val(zs[0]):null;
  $("lim").textContent=v==null?"--":v;window.curLimit=zs.length?Math.max(...zs.map(val).filter(x=>x!=null),0):0;
  $("zones").innerHTML=zs.length?zs.map(z=>{const a=ndr>0?Math.max(z[0],sk):Math.min(z[1],sk),b=ndr>0?Math.min(z[1],n[1]):Math.max(z[0],n[1]),x=val(z);return`<div class="z"><span>${fmt(a)} → ${fmt(b)}</span><b>${x==null?"--":x}</b></div>`}).join(""):`<p class="mute">${t("noSp")}</p>`;
}
$("tgo").onclick=loadTrain;$("tno").onkeydown=e=>{if(e.key==="Enter")loadTrain()};
$("stations").onclick=e=>{const r=e.target.closest(".st");if(!r)return;cur=+r.dataset.i;drawTrip();const s=ord()[cur],ph=phoneFor(s[0]);if(ph)openSheet(nm(s[0]),ph)};
function openSheet(name,num){$("sh-name").textContent=name;$("sh-num").textContent=num;$("sh-call").dataset.n=num;$("sheet").hidden=false}
$("sh-x").onclick=()=>{$("sheet").hidden=true};
$("sheet").onclick=e=>{if(e.target.id==="sheet")$("sheet").hidden=true};
$("sh-call").onclick=()=>{const n=$("sh-call").dataset.n;$("sheet").hidden=true;location.href="tel:"+n.replace(/[^0-9+]/g,"")};
$("cat").onclick=e=>{const b=e.target.closest("button");if(!b)return;cat=+b.dataset.c;drawTrip()};
$("prv").onclick=()=>{if(cur>0){cur--;drawTrip()}};
$("nxt").onclick=()=>{if(cur<ord().length-1){cur++;drawTrip()}};
$("auto").onclick=()=>{autoPick();drawTrip()};
$("gps").onclick=()=>{
  if(!navigator.geolocation){alert("GPS ✗");return}
  if(watch!=null){navigator.geolocation.clearWatch(watch);watch=null;$("spd").textContent="--";$("gb").style.width="0";$("gps").textContent=t("run");return}
  watch=navigator.geolocation.watchPosition(p=>{
    const v=p.coords.speed==null?null:p.coords.speed*3.6;$("spd").textContent=v==null?"--":Math.round(v);
    const mx=Math.max(160,window.curLimit||0);$("gb").style.width=Math.min(100,(v||0)/mx*100)+"%";
    const L=window.curLimit||0;$("gb").style.background=L&&v>L?"var(--red)":"var(--green)";
    $("gl").hidden=!L;if(L)$("gl").style.insetInlineStart=(L/mx*100)+"%";
  },()=>{$("spd").textContent="✗";watch=null;$("gps").textContent=t("run")},{enableHighAccuracy:true,maximumAge:0});
  $("gps").textContent=t("stop");
};

/* ===== الساعات ===== */
function prefillHours(){
  if(!$("hd").value)$("hd").value=new Date().toISOString().slice(0,10);
  if(tr&&!$("hs").value){$("hs").value=hm(tr.stops[0].d-60);$("he").value=hm(tr.stops[tr.stops.length-1].a)}
}
const band=m=>{m=((m%1440)+1440)%1440;return m>=300&&m<780?.5:m>=780&&m<1260?.75:1};
const hh=m=>(m/60).toFixed(2).replace(/\.00$/,"")+" h";
$("t2").oninput=()=>{const x=TR[$("t2").value.trim().toUpperCase()];if(x)$("he").value=hm(x.stops[x.stops.length-1].a);showDay()};
function calcOld(){
  const[sh,sm]=($("hs").value||"0:0").split(":").map(Number),[eh,em]=($("he").value||"0:0").split(":").map(Number);
  if(!$("hs").value||!$("he").value){$("hout").textContent=t("need");return}
  const s=sh*60+sm;let e=eh*60+em;if(e<=s)e+=1440;
  const total=e-s,fri=new Date($("hd").value+"T12:00").getDay()===5;
  let h="";
  const kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
  h+=kv(t("tot"),hhmm(total)+" ("+hm(s)+" → "+hm(e)+")");
  if(fri){h+=kv(t("fri"),hhmm(Math.min(total,720)))}
  else{
    const nor=Math.min(total,480),ov=Math.min(Math.max(total-480,0),240);
    let b={.5:0,.75:0,1:0},eq=0;
    for(let m=s+480;m<s+480+ov;m++){const r=band(m);b[r]++;eq+=r}
    h+=kv(t("nor"),hhmm(nor))+kv(t("ovr"),hhmm(ov));
    h+=kv("50% (05-13)",hhmm(b[.5]))+kv("75% (13-21)",hhmm(b[.75]))+kv("100% (21-05)",hhmm(b[1]))+kv(t("eq"),hhmm(eq));
  }
  $("hout").innerHTML=h;
}
const hhmm=m=>String(Math.floor(m/60)).padStart(2,"0")+"h"+String(Math.round(m%60)).padStart(2,"0");
const kvh=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
const today=()=>new Date().toISOString().slice(0,10);
const isFri=()=>new Date(($("hd").value||today())+"T12:00").getDay()===5;
function span(s,e,fri){const total=e-s,o={total,b:{.5:0,.75:0,1:0},eq:0,nor:0,ov:0,fri:0};
  if(fri){o.fri=Math.min(total,720);return o}
  o.nor=Math.min(total,480);o.ov=Math.min(Math.max(total-480,0),240);
  for(let m=s+480;m<s+480+o.ov;m++){const r=band(m);o.b[r]++;o.eq+=r}
  return o}
function dayCalc(){const hs=$("hs").value,he=$("he").value;if(!hs||!he)return null;
  const[sh,sm]=hs.split(":").map(Number),[eh,em]=he.split(":").map(Number);const s=sh*60+sm;let e=eh*60+em;if(e<=s)e+=1440;
  const fri=isFri(),o=span(s,e,fri);o.s=s;o.e=e;o.friDay=fri;o.trv=0;
  if(tr){const last=(TR[$("t2").value.trim().toUpperCase()]||tr).stops.slice(-1)[0].a;let d=last-tr.stops[0].d;if(d<0)d+=1440;o.trv=d}
  return o}
function showDay(){const o=dayCalc();if(!o){$("hout").textContent=t("need");return null}
  let h=kvh(t("tot"),hhmm(o.total)+" ("+hm(o.s)+" → "+hm(o.e)+")");
  if(o.trv)h+=kvh(t("trvH"),hhmm(o.trv));
  if(o.friDay)h+=kvh(t("fri"),hhmm(o.fri));
  else h+=kvh(t("nor"),hhmm(o.nor))+kvh(t("ovr"),hhmm(o.ov))+kvh("50% (05-13)",hhmm(o.b[.5]))+kvh("75% (13-21)",hhmm(o.b[.75]))+kvh("100% (21-05)",hhmm(o.b[1]))+kvh(t("eq"),hhmm(o.eq));
  $("hout").innerHTML=h;return o}
function addRec(o,k,tn){S.log.push({id:Date.now(),d:$("hd").value||today(),k,tr:tn,s:o.s,tot:o.total,trv:o.trv||0,nor:o.nor,ov:o.ov,b5:o.b[.5],b75:o.b[.75],b100:o.b[1],eq:o.eq,fri:o.fri||0});save();drawLog()}
function drawLog(){
  const m=$("hm").value||today().slice(0,7);$("hm").value=m;
  const L=S.log.filter(r=>r.d.slice(0,7)===m).sort((a,b)=>a.d<b.d?-1:1),sm=f=>L.reduce((a,r)=>a+(r[f]||0),0);
  $("msum").innerHTML=kvh(t("days"),L.filter(r=>r.k==="trip").length)+kvh(t("resDays"),L.filter(r=>r.k==="res").length)+kvh(t("tot"),hhmm(sm("tot")))+kvh(t("trvH"),hhmm(sm("trv")))+kvh(t("nor"),hhmm(sm("nor")))+kvh(t("ovr"),hhmm(sm("ov")))+kvh("50%",hhmm(sm("b5")))+kvh("75%",hhmm(sm("b75")))+kvh("100%",hhmm(sm("b100")))+kvh(t("eq"),hhmm(sm("eq")))+kvh(t("fri"),hhmm(sm("fri")));
  $("hlog").innerHTML=L.map(r=>`<div class="kv"><span>${r.d} · ${r.k==="res"?t("reserveT").split(" (")[0]+" "+hm(r.s):"#"+(r.tr||"—")}</span><span>${hhmm(r.tot)} <button data-id="${r.id}" class="btn s" style="width:auto;padding:2px 10px">✕</button></span></div>`).join("")}
["hd","hs","he"].forEach(id=>$(id).oninput=showDay);
$("hm").onchange=drawLog;
$("hc").onclick=()=>{const o=showDay();if(o)addRec(o,"trip",tr?tr.no:"")};
$("rsv").onclick=()=>{const s=+$("rshift").value,ot=Math.min(4,Math.max(0,+$("rot").value||0)),e=s+480+ot*60,o=span(s,e,isFri());o.s=s;o.e=e;o.trv=0;addRec(o,"res","")};
$("hlog").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.log=S.log.filter(r=>String(r.id)!==b.dataset.id);save();drawLog()};
$("ussave").onclick=()=>{try{const u=JSON.parse($("usrj").value||"{}");Object.keys(u).forEach(k=>{if(!/^\d{6}[A-Z]$/.test(k))throw 0});S.users=u;save();$("usmsg").textContent=t("saved");boot()}catch(e){$("usmsg").textContent=t("bad")}};

/* ===== التقارير ===== */
function drawRep(){
  $("rlist").innerHTML=S.reports.length?S.reports.slice().reverse().map(r=>`<div class="kv" style="display:block"><b>${t("rt")[r.k]}</b> <span class="mute">${new Date(r.t).toLocaleString(S.lang==="ar"?"ar-DZ":"fr-DZ")}${r.tr?" · "+r.tr:""}</span><div>${r.x.replace(/</g,"&lt;")}</div></div>`).join(""):`<p class="mute">${t("none")}</p>`;
}
$("rsave").onclick=()=>{const x=$("rtxt").value.trim();if(!x)return;S.reports.push({t:Date.now(),k:+$("rtype").value,tr:tr?tr.no:"",x});save();$("rtxt").value="";drawRep()};
$("rcopy").onclick=async()=>{const txt=S.reports.map(r=>`[${t("rt")[r.k]}] ${new Date(r.t).toLocaleString()} ${r.tr?"#"+r.tr:""}\n${r.x}`).join("\n\n");try{await navigator.clipboard.writeText(txt);$("rcopy").textContent=t("saved")}catch(e){}setTimeout(()=>$("rcopy").textContent=t("copyAll"),1500)};

/* ===== بيانات: هواتف + توقيت المحطات ===== */
function drawPhones(){
  const names=[...new Set(LINES.flatMap(l=>l.st.map(s=>s[0])).concat(['Bazoul P1','Bazoul P2']))].sort();
  const v=$("pst").value;$("pst").innerHTML=names.map(n=>`<option>${n}</option>`).join("");if(v)$("pst").value=v;
  $("plist").innerHTML=Object.entries(S.phones).map(([n,p])=>`<div class="kv"><span>${n}</span><a href="tel:${p}">${p}</a></div>`).join("");
}
$("psave").onclick=()=>{const p=$("pnum").value.trim(),n=$("pst").value;if(p)S.phones[n]=p;else delete S.phones[n];save();$("pnum").value="";drawPhones();if(tr)info()};
$("svsave").onclick=()=>{try{S.svc=JSON.parse($("svcj").value);save();$("svmsg").textContent=t("saved");if(tr)drawTrip()}catch(e){$("svmsg").textContent=t("bad")}};
$("svreset").onclick=()=>{S.svc=JSON.parse(JSON.stringify(SVC0));save();$("svcj").value=JSON.stringify(S.svc,null,1);if(tr)drawTrip()};
// ================= حساب الساعات (نسخة مراجَعة: ذهاب + عودة EV) — تعريفات لاحقة تغلب السابقة =================
function parseRet(){const v=$('t2').value.trim().toUpperCase();if(!v)return{mode:'none',label:''};if(v==='EV-CAR')return{mode:'car',label:'EV-CAR'};const k=v.startsWith('EV-')?v.slice(3):v,x=TR[k];return x&&!isFreight(x.no)?{mode:'train',tr:x,label:'EV-'+x.no}:{mode:'bad',label:v}}
function prefillHours(){if(!$('hd').value)$('hd').value=today();if(tr&&!$('hs').value)$('hs').value=hm(tr.stops[0].d-60)}
function dayCalc(){const d=$('hd').value||today(),hs=$('hs').value,he=$('he').value;if(!hs||!he)return null;
  const st=new Date(d+'T'+hs);let en=new Date(($('hd2').value||d)+'T'+he);
  if(!$('hd2').value&&en<=st)en=new Date(en.getTime()+864e5);
  if(en<=st)return null;
  const total=Math.round((en-st)/6e4),sm=st.getHours()*60+st.getMinutes(),fri=isFri(),o=span(sm,sm+total,fri);
  o.s=sm;o.e=sm+total;o.friDay=fri;o.trv=Math.max(0,total-60);o.ret=parseRet();return o}
function showDay(){const r=parseRet(),o=dayCalc();let h='';
  if(r.mode==='none')h+=`<p class='mute' style='color:var(--amber)'>${t('retNeed')}</p>`;
  if(r.mode==='bad')h+=`<p class='mute' style='color:var(--red)'>${t('retBad')}</p>`;
  if(!o){$('hout').innerHTML=h;return null}
  h+=kvh(t('retL'),r.label||'—')+kvh(t('tot'),hhmm(o.total))+kvh(t('trvH'),hhmm(o.trv));
  if(o.friDay)h+=kvh(t('fri'),hhmm(o.fri));
  else h+=kvh(t('nor'),hhmm(o.nor))+kvh(t('ovr'),hhmm(o.ov))+kvh('50% (05-13)',hhmm(o.b[.5]))+kvh('75% (13-21)',hhmm(o.b[.75]))+kvh('100% (21-05)',hhmm(o.b[1]))+kvh(t('eq'),hhmm(o.eq));
  $('hout').innerHTML=h;return o}
function addRec(o,k,tn){S.log.push({id:Date.now(),d:$('hd').value||today(),k,tr:tn,ret:(o.ret&&o.ret.label)||'',s:o.s,tot:o.total,trv:o.trv||0,nor:o.nor,ov:o.ov,b5:o.b[.5],b75:o.b[.75],b100:o.b[1],eq:o.eq,fri:o.fri||0});save();drawLog()}
function drawLog(){const m=$('hm').value||today().slice(0,7);$('hm').value=m;
  const L=S.log.filter(r=>r.d.slice(0,7)===m).sort((a,b)=>a.d<b.d?-1:1),sm=f=>L.reduce((a,r)=>a+(r[f]||0),0);
  $('msum').innerHTML=kvh(t('days'),L.filter(r=>r.k==='trip').length)+kvh(t('resDays'),L.filter(r=>r.k==='res').length)+kvh(t('tot'),hhmm(sm('tot')))+kvh(t('trvH'),hhmm(sm('trv')))+kvh(t('nor'),hhmm(sm('nor')))+kvh(t('ovr'),hhmm(sm('ov')))+kvh('50%',hhmm(sm('b5')))+kvh('75%',hhmm(sm('b75')))+kvh('100%',hhmm(sm('b100')))+kvh(t('eq'),hhmm(sm('eq')))+kvh(t('fri'),hhmm(sm('fri')));
  $('hlog').innerHTML=L.map(r=>`<div class='kv'><span>${r.d} · ${r.k==='res'?t('reserveT').split(' (')[0]+' '+hm(r.s):'#'+(r.tr||'—')+' ⇄ '+(r.ret||'—')}</span><span>${hhmm(r.tot)} <button data-id='${r.id}' class='btn s' style='width:auto;padding:2px 10px'>✕</button></span></div>`).join('')}
$('t2').oninput=()=>{const r=parseRet();if(r.mode==='train')$('he').value=hm(r.tr.stops[r.tr.stops.length-1].a);showDay()};
['hd','hd2','hs','he'].forEach(id=>$(id).oninput=showDay);
$('hc').onclick=()=>{const o=dayCalc();if(!o||!o.ret||o.ret.mode==='none'||o.ret.mode==='bad'){showDay();return}addRec(o,'trip',tr?tr.no:'')};

function openSvc(n){const sv=S.svc[n]||{},st=svcState(n);let h=`<div class='big'>${nm(n)}</div>`;
  if(st)h+=`<span class='tag ${st.closed?'bad':'ok'}'>${st.closed?t('closed'):t('open')}</span>`;
  if(sv.c24)h+=`<p>${t('h24')}</p>`;else if(sv.c)h+=kvh(t('cessT'),sv.c)+kvh(t('resT'),sv.r);else h+=`<p class='mute'>${t('noHrs')}</p>`;

$('svc').onclick=e=>{if(e.target.closest('#svbtn')&&cur!=null)openSvc(ord()[cur][0])};
$('sv2-x').onclick=()=>{$('sheet2').hidden=true};$('sheet2').onclick=e=>{if(e.target.id==='sheet2')$('sheet2').hidden=true};
boot();
